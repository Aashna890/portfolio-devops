---
- name: Rollback Portfolio App
  hosts: local
  become: false

  vars:
    container_name: portfolio-container
    image_name: portfolio-app
    app_port: 8085
    rollback_tag: "1.0.1"

  tasks:

    - name: Stop current container
      command: docker stop {{ container_name }}
      ignore_errors: yes

    - name: Remove current container
      command: docker rm {{ container_name }}
      ignore_errors: yes

    - name: Start container with previous version
      command: >
        docker run -d
        -p {{ app_port }}:{{ app_port }}
        --name {{ container_name }}
        --restart unless-stopped
        {{ image_name }}:{{ rollback_tag }}
      ignore_errors: yes

    - name: Verify rollback container is running
      command: docker ps --filter name={{ container_name }}
      register: status

    - name: Show rollback status
      debug:
        msg: "{{ status.stdout }}"
