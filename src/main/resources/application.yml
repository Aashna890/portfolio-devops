server:
  port: 8085

spring:
  application:
    name: portfolio

  datasource:
    url: jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info