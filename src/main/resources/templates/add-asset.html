<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Asset</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand fw-bold">Portfolio Dashboard</span>
  <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm">← Back</a>
</nav>

<div class="container py-5" style="max-width:600px">
  <div class="card">
    <div class="card-header"><h5 class="mb-0">Add New Asset</h5></div>
    <div class="card-body">
      <form th:action="@{/assets/add}" method="post" th:object="${asset}">
        <div class="mb-3">
          <label class="form-label">Ticker Symbol</label>
          <input type="text" class="form-control" th:field="*{ticker}"
                 placeholder="e.g. RELIANCE" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Company / Fund Name</label>
          <input type="text" class="form-control" th:field="*{name}"
                 placeholder="e.g. Reliance Industries" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Asset Type</label>
          <select class="form-select" th:field="*{type}" required>
            <option value="">-- Select --</option>
            <option value="STOCK">Stock</option>
            <option value="MUTUAL_FUND">Mutual Fund</option>
            <option value="BOND">Bond</option>
            <option value="ETF">ETF</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantity</label>
          <input type="number" step="0.01" class="form-control"
                 th:field="*{quantity}" placeholder="e.g. 10" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Buy Price (₹)</label>
          <input type="number" step="0.01" class="form-control"
                 th:field="*{buyPrice}" placeholder="e.g. 2450.00" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Buy Date</label>
          <input type="date" class="form-control" th:field="*{buyDate}">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">Save Asset</button>
          <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
